spring:
  application:
    name: signaltrellis
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/signaltrellis}
    username: ${DATABASE_USERNAME:signaltrellis}
    password: ${DATABASE_PASSWORD:local-dev-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    openai:
      base-url: ${SIGNALTRELLIS_AI_BASE_URL:http://localhost:20128}
      api-key: ${SIGNALTRELLIS_AI_API_KEY:}
      timeout: PT45S
      max-retries: 0
      chat:
        completions-path: /v1/chat/completions
        options:
          model: ${SIGNALTRELLIS_AI_MODEL:auto/best-free}
          temperature: 0.1
          max-completion-tokens: 2048
      embedding:
        model: ${SIGNALTRELLIS_EMBEDDING_MODEL:gemini/gemini-embedding-2}
    mcp:
      server:
        protocol: STATELESS
        type: SYNC
        annotation-scanner:
          enabled: ${SIGNALTRELLIS_MCP_ENABLED:false}
    tools:
      limits:
        max-calls-per-tool-default: 3
        max-total-tool-calls: 8
        on-limit-exceeded: RETURN_ERROR_RESPONSE
    retry:
      max-attempts: 1

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Local development key only. Set SIGNALTRELLIS_JWT_SECRET in every deployed environment.
    secret: ${SIGNALTRELLIS_JWT_SECRET:U2lnbmFsVHJlbGxpc0xvY2FsRGV2U2VjcmV0MTIzNDU2Nzg5MA==}
    expiration: PT15M

storage:
  documents:
    directory: ${SIGNALTRELLIS_DOCUMENT_STORAGE:./.data/documents}

signaltrellis:
  processing:
    poll-interval: ${SIGNALTRELLIS_PROCESSING_POLL_INTERVAL:PT2S}
    max-attempts: ${SIGNALTRELLIS_PROCESSING_MAX_ATTEMPTS:5}
    batch-size: ${SIGNALTRELLIS_PROCESSING_BATCH_SIZE:1}
    lease: ${SIGNALTRELLIS_PROCESSING_LEASE:PT45M}
  retrieval:
    embeddings-enabled: ${SIGNALTRELLIS_EMBEDDINGS_ENABLED:false}
    embedding-model: ${SIGNALTRELLIS_EMBEDDING_MODEL:gemini/gemini-embedding-2}
    max-document-characters: ${SIGNALTRELLIS_RETRIEVAL_MAX_CHARS:20000}
  ai:
    enabled: ${SIGNALTRELLIS_AI_ENABLED:false}
    assistant-enabled: ${SIGNALTRELLIS_ASSISTANT_ENABLED:false}
    model: ${SIGNALTRELLIS_AI_MODEL:auto/best-free}
    max-input-characters: ${SIGNALTRELLIS_AI_MAX_INPUT_CHARACTERS:20000}
  ocr:
    tesseract-path: ${SIGNALTRELLIS_TESSERACT_PATH:tesseract}
    languages: ${SIGNALTRELLIS_OCR_LANGUAGES:eng}
