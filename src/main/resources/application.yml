spring:
  application:
    name: signaltrellis
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/signaltrellis}
    username: ${DATABASE_USERNAME:signaltrellis}
    password: ${DATABASE_PASSWORD:local-dev-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Local development key only. Set SIGNALTRELLIS_JWT_SECRET in every deployed environment.
    secret: ${SIGNALTRELLIS_JWT_SECRET:U2lnbmFsVHJlbGxpc0xvY2FsRGV2U2VjcmV0MTIzNDU2Nzg5MA==}
    expiration: PT15M

storage:
  documents:
    directory: ${SIGNALTRELLIS_DOCUMENT_STORAGE:./.data/documents}

