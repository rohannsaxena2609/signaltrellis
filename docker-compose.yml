services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: signaltrellis
      POSTGRES_USER: signaltrellis
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5433:5432"
    volumes:
      - signaltrellis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaltrellis -d signaltrellis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signaltrellis-postgres:
